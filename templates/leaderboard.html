{% extends "base.html" %}
{% block content %}
<h2>Leaderboard</h2>
<table>
    <tr>
        <th>Nickname</th>
        <th>Score</th>
    </tr>
    {% for user in users %}
    <tr>
        <td>{{ user.nickname }}</td>
        <td>{{ user.score }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
